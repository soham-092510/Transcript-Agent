<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LearnLens AI Companion</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-size: 13px;
    }
    header {
      padding: 12px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-weight: bold;
      color: #22c55e;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 90%;
      line-height: 1.4;
    }
    .msg.user {
      background: #16a34a;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .msg.assistant {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }
    footer {
      padding: 12px;
      background: #1e293b;
      border-top: 1px solid #334155;
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 12px;
      color: white;
      font-size: 12px;
      outline: none;
    }
    input:focus {
      border-color: #22c55e;
    }
    button {
      background: #22c55e;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #16a34a;
    }
    .app-link {
      display: block;
      text-align: center;
      padding: 6px;
      background: #0284c7;
      color: white;
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <a href="http://localhost:5173" target="_blank" class="app-link">Launch Full LearnLens AI Studio ↗</a>
  <header>
    <div class="logo">
      <span>🎓 LearnLens AI</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #94a3b8;">
      <span class="status-dot" id="server-status"></span>
      <span id="status-text">Connected</span>
    </div>
  </header>

  <div id="chat-box">
    <div class="msg assistant">
      👋 Hello! I am your LearnLens AI Companion. Ask me anything about what you are currently studying on this screen!
    </div>
  </div>

  <footer>
    <input type="text" id="query-input" placeholder="Ask your AI Teacher..." />
    <button id="send-btn">Ask</button>
  </footer>

  <script src="sidepanel.js"></script>
</body>
</html>
