<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LearnLens AI</title>
  <style>
    body {
      width: 280px;
      padding: 16px;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h2 {
      margin: 0 0 4px 0;
      font-size: 15px;
      color: #22c55e;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      font-size: 11px;
      color: #94a3b8;
      margin: 0 0 14px 0;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      background: #22c55e;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      border: none;
      margin-bottom: 8px;
    }
    .btn:hover {
      background: #16a34a;
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .btn-secondary:hover {
      background: #334155;
    }
    .status {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h2>🎓 LearnLens AI</h2>
  <p>Show your AI what you are learning</p>

  <button class="btn" id="open-studio">Open Full Web Studio</button>
  <button class="btn btn-secondary" id="open-sidepanel">Open Side Panel</button>

  <div class="status" id="server-status">Checking local server...</div>

  <script src="popup.js"></script>
</body>
</html>
